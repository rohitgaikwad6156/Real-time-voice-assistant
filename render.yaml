services:
  - type: web
    name: real-time-voice-assistant
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-10000}
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_LIVE_MODEL
        value: gemini-2.5-flash-native-audio-latest
      - key: GEMINI_VOICE_NAME
        value: Puck
      - key: WEATHER_API_PROVIDER
        value: open-meteo
      - key: WEATHER_API_KEY
        value: open-meteo
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: voice_assistant
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE_MINUTES
        value: 10080
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://real-time-voice-assistant-lovat.vercel.app
